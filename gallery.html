<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savanna Brew Café - Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <img src="images/savanna-brew-logo.jpg" alt="Savanna Brew Café logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="page-banner">
    <img src="images/gallery-banner.jpg" alt="Coffee cup and latte art" class="banner-img">
    <div class="page-banner-text">
    </div>
  </section>

  <main class="gallery-page">
    <div class="gallery-grid">

      <figure class="gallery-item">
        <img src="images/latte.jpg" alt="Latte" class="gallery-photo">
        <figcaption>Latte</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/cappuccino.jpg" alt="Cappuccino" class="gallery-photo">
        <figcaption>Cappuccino</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/iced-coffee.jpg" alt="Iced coffee" class="gallery-photo">
        <figcaption>Iced Coffee</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/iced-latte.jpg" alt="Iced latte" class="gallery-photo">
        <figcaption>Iced Latte</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/croissant.jpg" alt="Croissant" class="gallery-photo">
        <figcaption>Croissant</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/muffin.jpg" alt="Blueberry muffin" class="gallery-photo">
        <figcaption>Muffin</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/chocolate-cake.jpg" alt="Chocolate cake slice" class="gallery-photo">
        <figcaption>Chocolate Cake</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="images/fruit-tart.jpg" alt="Fruit tart" class="gallery-photo">
        <figcaption>Fruit Tart</figcaption>
      </figure>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <img src="images/savanna-brew-logo.jpg" alt="Savanna Brew Café logo" class="footer-logo">
      <p>Brewed in Kenya. Served with love.</p>
    </div>
    <div class="footer-social">
      <h4>Follow Us:</h4>
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">X</a>
      <a href="#">YouTube</a>
    </div>
    <div class="footer-contact">
      <h4>Contact Us:</h4>
      <p>info@savannabrew.co.ke</p>
      <p>+254 700 123 456</p>
    </div>
  </footer>

</body>
</html>
