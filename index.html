<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savanna Brew Café - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <img src="images/savanna-brew-logo.jpg" alt="Savanna Brew Café logo" class="logo">
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <img src="images/savanna-banner-logo.jpg" alt="Savanna Brew Café banner" class="banner-img">
    <div class="hero-text">
      <h2>Brewed in Kenya.<br>Served with love.</h2>
      <a href="menu.html" class="btn">View Our Menu →</a>
    </div>
  </section>

  <main>
    <section class="welcome">
      <h1>Welcome to Savanna Brew</h1>
      <p>Experience the rich taste of Kenyan coffee, freshly brewed with passion, in a cozy and welcoming space.</p>
    </section>

    <section class="favourites">
      <h2>Our Favourites</h2>
      <div class="menu-grid">

        <div class="menu-item">
          <img src="images/latte.jpg" alt="A cup of latte" class="photo">
          <h3>Latte</h3>
          <p class="price">KES 320</p>
        </div>

        <div class="menu-item">
          <img src="images/cappuccino.jpg" alt="A cup of cappuccino" class="photo">
          <h3>Cappuccino</h3>
          <p class="price">KES 300</p>
        </div>

        <div class="menu-item">
          <img src="images/croissant.jpg" alt="A freshly baked croissant" class="photo">
          <h3>Croissant</h3>
          <p class="price">KES 250</p>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
